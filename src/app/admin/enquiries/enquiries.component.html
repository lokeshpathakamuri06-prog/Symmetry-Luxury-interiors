<div class="page"><div class="page-head"><div><span class="eyebrow">CMS Management</span><h1 class="page-title">Enquiries</h1><p class="page-subtitle">Track leads received from the website.</p></div><button class="primary-btn"><i class="bi bi-plus-lg"></i> Add New</button></div><div class="toolbar"><input placeholder="Search enquiries..."><select><option>All Status</option><option>Active</option><option>Published</option><option>Pending</option></select><button class="secondary-btn"><i class="bi bi-funnel"></i> Filters</button></div><div class="table-card"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Service</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody>@for(i of [0,1,2,3];track i){<tr><td>{{row[0]}}</td><td>{{row[1]}}</td><td>{{row[2]}}</td><td>{{row[3]}}</td><td><div class="actions"><button class="icon-btn" title="Edit"><i class="bi bi-pencil"></i></button><button class="icon-btn" title="Delete"><i class="bi bi-trash"></i></button></div></td></tr>}</tbody></table></div><div class="pagination"><button>1</button><button>2</button><button>›</button></div></div></div>
