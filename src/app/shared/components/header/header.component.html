<header class="site-header" [class.scrolled]="isScrolled">
  <div class="container-fluid header-container">
    <a routerLink="/" class="brand-logo" (click)="closeMenu()">
      <img src="assets/images/logo.svg" alt="Symmetry Interiors" class="logo-main">
    </a>

    <nav class="desktop-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/global-sourcing" routerLinkActive="active">Global Sourcing</a>
      <a routerLink="/blog" routerLinkActive="active">Blog</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" aria-label="Search"><i class="bi bi-search"></i></button>
      <a routerLink="/cart" class="icon-btn cart-btn" aria-label="Cart">
        <i class="bi bi-bag"></i><span class="cart-count">0</span>
      </a>
      <a routerLink="/contact" class="sym-btn enquire-btn">Enquire Now</a>
      <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Menu">
        <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen"></i>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="menuOpen">
    <a routerLink="/" (click)="closeMenu()">Home</a>
    <a routerLink="/about" (click)="closeMenu()">About</a>
    <a routerLink="/services" (click)="closeMenu()">Services</a>
    <a routerLink="/shop" (click)="closeMenu()">Shop</a>
    <a routerLink="/projects" (click)="closeMenu()">Projects</a>
    <a routerLink="/global-sourcing" (click)="closeMenu()">Global Sourcing</a>
    <a routerLink="/blog" (click)="closeMenu()">Blog</a>
    <a routerLink="/contact" (click)="closeMenu()">Contact</a>
    <a routerLink="/contact" class="sym-btn mobile-enquire" (click)="closeMenu()">Enquire Now</a>
  </div>
</header>
