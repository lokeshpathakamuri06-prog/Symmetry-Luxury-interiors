<section class="page-hero"><div class="container"><span class="section-label">Complete Your Order</span><h1>Checkout</h1></div></section><section class="section-padding"><div class="container"><div class="row g-5"><div class="col-lg-7"><form [formGroup]="form" (ngSubmit)="placeOrder()" class="checkout-form"><h2>Customer Details</h2><div class="row g-3"><div class="col-md-6"><label>Name</label><input formControlName="name" class="form-control"></div><div class="col-md-6"><label>Email</label><input formControlName="email" class="form-control"></div><div class="col-md-6"><label>Phone</label><input formControlName="phone" class="form-control"></div><div class="col-12"><label>Address</label><textarea formControlName="address" class="form-control"></textarea></div><div class="col-md-6"><label>City</label><input formControlName="city" class="form-control"></div><div class="col-md-6"><label>Pincode</label><input formControlName="pincode" class="form-control"></div><div class="col-12"><label>Payment Method</label><select formControlName="payment" class="form-select"><option>Card</option><option>UPI</option><option>Net Banking</option><option>Cash on Delivery</option></select></div></div><button class="sym-btn mt-4" [disabled]="form.invalid">Place Order</button></form></div><div class="col-lg-5"><div class="summary"><h2>Order Summary</h2><p>Luna Lounge Chair <strong>₹85,000</strong></p><p>Shipping <strong>₹0</strong></p><p class="total">Total <strong>₹85,000</strong></p></div></div></div></div></section>
