<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <!-- Outer square -->
  <rect x="148" y="8"  width="104" height="104" rx="2" stroke="rgba(255,255,255,0.9)" stroke-width="3.5" fill="none"/>
  <!-- Second square -->
  <rect x="157" y="17" width="86"  height="86"  rx="2" stroke="rgba(255,255,255,0.75)" stroke-width="2.8" fill="none"/>
  <!-- Third square -->
  <rect x="166" y="26" width="68"  height="68"  rx="2" stroke="rgba(255,255,255,0.6)" stroke-width="2.2" fill="none"/>
  <!-- Fourth square -->
  <rect x="175" y="35" width="50"  height="50"  rx="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" fill="none"/>

  <!-- S letterform -->
  <rect x="175" y="35" width="50" height="9"  fill="white" rx="1"/>
  <rect x="175" y="35" width="9"  height="28" fill="white" rx="1"/>
  <rect x="175" y="55" width="50" height="9"  fill="white" rx="1"/>
  <rect x="216" y="55" width="9"  height="28" fill="white" rx="1"/>
  <rect x="175" y="76" width="50" height="9"  fill="white" rx="1"/>

  <!-- SYMMETRY wordmark -->
  <text
    x="200"
    y="148"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="300"
    letter-spacing="10"
    text-anchor="middle"
    fill="white">SYMMETRY</text>

  <!-- INTERIORS subtext -->
  <text
    x="200"
    y="172"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="300"
    letter-spacing="6"
    text-anchor="middle"
    fill="rgba(255,255,255,0.7)">INTERIORS</text>
</svg>
